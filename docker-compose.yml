# Lokal utvecklingsmiljö för backend + frontend (EuroMotors Internal Platform)
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile # Din befintliga backend-Dockerfil
    container_name: image-editor-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      - ./backend:/app
    command: ["npm", "run", "dev"]
    # Gör att backend startar om automatiskt vid kodändringar
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: image-editor-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    volumes:
      - ./frontend:/app
    command: ["npm", "run", "dev"]
    depends_on:
      - backend
